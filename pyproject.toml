[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "legacy-ssis-azure-migration-demo"
version = "0.1.0"
description = "Runnable local simulation of legacy SSIS to Azure migration"
requires-python = ">=3.9"
dependencies = []
[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]
test = ["pytest>=8,<9"]
[tool.setuptools.packages.find]
where = ["src"]
